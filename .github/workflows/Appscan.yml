name: HCL AppScan on Cloud (ASoC) SAST & SCA Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  AppScan-SAST-SCA:
    name: Run AppScan SAST & SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # --- WAJIB UNTUK EXPRESSJS AGAR SCA BISA BACA DEPENDENSI ---
      - name: 2. Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install NPM Packages
        run: npm install --legacy-peer-deps

      # --- OTENTIKASI & DOWNLOAD SACLIENTUTIL VIA API V4 ---
      - name: 3. Authenticate & Download SAClientUtil
        env:
          ASOC_ID: ${{ secrets.ASOC2_ID }}
          ASOC_SECRET: ${{ secrets.ASOC2_SECRET }}
        run: |
          if [ -z "$ASOC_ID" ] || [ -z "$ASOC_SECRET" ]; then
            echo "ERROR: ASOC_ID atau ASOC_SECRET tidak ditemukan di Secrets!"
            exit 1
          fi

          # Buat payload JSON secara aman menggunakan jq
          JSON_PAYLOAD=$(jq -n --arg id "$ASOC_ID" --arg sec "$ASOC_SECRET" '{KeyId: $id, KeySecret: $sec}')

          # 1. Login ke API v4 ASoC untuk mendapatkan Bearer Token
          AUTH_RESPONSE=$(curl -s -X POST "https://cloud.appscan.com/api/v4/Account/ApiKeyLogin" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          TOKEN=$(echo $AUTH_RESPONSE | jq -r '.Token // empty')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Gagal Otentikasi API Key!"
            echo "Response: $AUTH_RESPONSE"
            exit 1
          fi

          echo "Berhasil otentikasi! Mengunduh SAClientUtil..."

          # 2. Download SAClientUtil menggunakan Bearer Token
          curl -sS -L -H "Authorization: Bearer $TOKEN" "https://cloud.appscan.com/api/v4/Tools/SAClientUtil?os=linux" -o SAClientUtil.zip

          # 3. Ekstrak dan atur PATH
          unzip -q SAClientUtil.zip
          SAC_DIR=$(find . -maxdepth 1 -type d -name "SAClientUtil*" | head -n 1)
          chmod +x $SAC_DIR/bin/appscan.sh
          echo "$PWD/$SAC_DIR/bin" >> $GITHUB_PATH

      - name: 4. Login to AppScan CLI
        run: |
          appscan.sh api_login -u ${{ secrets.ASOC2_ID }} -P ${{ secrets.ASOC2_SECRET }} -persist

      # --- EKSEKUSI 1: SCAN SAST (STATIC CODE ANALYSIS) ---
      - name: 5. Generate & Queue SAST Scan
        run: |
          echo "=== Membuat paket IRX untuk SAST ==="
          appscan.sh prepare -sastOnly -n SAST_ExpressJS_PNM2 -d . -f ./sast_scan.irx
          
          echo "=== Mengirim SAST ke ASoC ==="
          appscan.sh queue_analysis -a "96db2291-ca25-40c2-a0d7-f1b780bfe6ae" -n "SAST_ExpressJS_PNM2" -f ./sast_scan.irx

      # --- EKSEKUSI 2: SCAN SCA (OPEN SOURCE ANALYSIS) ---
      - name: 6. Generate & Queue SCA (Open Source) Scan
        run: |
          echo "=== Membuat paket IRX untuk SCA (Open Source) ==="
          appscan.sh prepare -osaOnly -n SCA_ExpressJS_PNM2 -d . -f ./sca_scan.irx
          
          echo "=== Mengirim SCA ke ASoC ==="
          appscan.sh queue_analysis -a "96db2291-ca25-40c2-a0d7-f1b780bfe6ae" -n "SCA_ExpressJS_PNM2" -f ./sca_scan.irx
