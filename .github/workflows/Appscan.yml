name: HCL AppScan on Cloud (ASoC) SAST & SCA Scan

on:
  push:
    branches: [ "main", "master", "VS_2010" ]
  pull_request:
    branches: [ "main", "master", "VS_2010" ]
  workflow_dispatch:

jobs:
  AppScan-SAST-SCA:
    name: Run AppScan SAST & SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      # --- STEP 4: SCAN SAST (KODE STATIS) ---
      - name: 4. Run AppScan SAST Scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.1.0
        continue-on-error: true
        with:
          asoc_key: ${{ secrets.ASOC2_ID }}
          asoc_secret: ${{ secrets.ASOC2_SECRET }}
          application_id: "96db2291-ca25-40c2-a0d7-f1b780bfe6ae"
          scan_name: "SAST_ExpressJS_PNM2"
          static_analysis_only: true
          wait_for_analysis: false

      # --- STEP 5: SCAN SCA (OPEN SOURCE ANALYSIS VIA CLI) ---
      - name: 5. Run AppScan SCA (Open Source) Scan
        continue-on-error: true
        env:
          ASOC_KEY: ${{ secrets.ASOC2_ID }}
          ASOC_SECRET: ${{ secrets.ASOC2_SECRET }}
        run: |
          echo "=== 1. Mengunduh SAClientUtil CLI ==="
          curl -sL "https://cloud.appscan.com/api/v2/Tools/SAClientUtil?os=Linux" -o SAClientUtil.zip
          unzip -q -o SAClientUtil.zip -d ./appscan_sca_tools
          
          # Menambahkan folder bin SAClientUtil ke PATH secara otomatis
          BIN_PATH=$(find $(pwd)/appscan_sca_tools -name "bin" -type d | head -n 1)
          export PATH=$PATH:$BIN_PATH

          echo "=== 2. Login ke AppScan on Cloud ==="
          appscan api_login -u "$ASOC_KEY" -P "$ASOC_SECRET"

          echo "=== 3. Membuat berkas IRX khusus SCA (-osaOnly) ==="
          appscan prepare -osaOnly -n "SCA_ExpressJS_PNM2" -f ./sca_result.irx

          echo "=== 4. Mengirim scan SCA ke ASoC ==="
          appscan queue_analysis -a "96db2291-ca25-40c2-a0d7-f1b780bfe6ae" -n "SCA_ExpressJS_PNM2" -f ./sca_result.irx
